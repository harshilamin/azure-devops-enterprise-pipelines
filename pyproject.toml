[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-demo-api"
version = "1.0.0"
description = "Reference workload for enterprise Azure DevOps pipeline templates"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "PyYAML>=6.0,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
pipeline-demo-api = "pipeline_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src/pipeline_demo --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["src/pipeline_demo"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "scripts/parse_buildx_metadata.py", "scripts/validate_digest.py", "scripts/smoke_test.py"]
exclude = ["scripts/bootstrap"]
