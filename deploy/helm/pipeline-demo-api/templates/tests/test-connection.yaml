apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pipeline-demo-api.fullname" . }}-test
  labels:
    {{- include "pipeline-demo-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.16.0
      command:
        - curl
        - --fail
        - --silent
        - http://{{ include "pipeline-demo-api.fullname" . }}:{{ .Values.service.port }}/health/ready
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
