apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pipeline-demo-api.fullname" . }}
  labels:
    {{- include "pipeline-demo-api.labels" . | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.environment | quote }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  COMMIT_SHA: {{ .Values.deployment.commitSha | quote }}
  BUILD_ID: {{ .Values.deployment.buildId | quote }}
  APP_PORT: {{ .Values.service.targetPort | quote }}
