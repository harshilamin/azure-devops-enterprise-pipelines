variables:
  vmImage: ubuntu-24.04
  pythonVersion: '3.12'
  terraformVersion: '1.15.8'
  helmVersion: '4.2.3'
  kubectlVersion: '1.36.1'
  trivyVersion: '0.73.0'
  syftVersion: '1.50.0'
  cosignVersion: '3.1.2'
  chartPath: deploy/helm/pipeline-demo-api
  terraformRoot: infra/terraform/live
  applicationName: pipeline-demo-api
  dockerfilePath: Dockerfile
  buildContext: .
  releaseBundleArtifact: release-bundle
  terraformPlanArtifact: terraform-plan
  testResultsArtifact: test-results
  securityReportsArtifact: security-reports
  acrServiceConnection: sc-azure-wif-platform
  acrLoginServer: replace-me.azurecr.io
  imageRepository: pipeline-demo-api
  cosignEnabled: 'false'
  cosignKeyReference: azurekms://replace-me.vault.azure.net/cosign-signing-key
  SmokeTestApiKey: ''
  sonarEnabled: 'false'
  sonarServiceConnection: sonarcloud-enterprise
  sonarOrganization: replace-me
  sonarProjectKey: replace-me_azure-devops-enterprise-pipelines
