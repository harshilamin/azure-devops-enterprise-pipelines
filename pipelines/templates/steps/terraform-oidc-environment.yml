parameters:
  azureServiceConnection: ''

steps:
  - task: AzureCLI@2
    displayName: Export Terraform OIDC environment
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        subscription_id="$(az account show --query id -o tsv)"
        {
          echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]${servicePrincipalId}"
          echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]${tenantId}"
          echo "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]${idToken}"
          echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;issecret=true]${subscription_id}"
          echo '##vso[task.setvariable variable=ARM_USE_OIDC]true'
          echo '##vso[task.setvariable variable=ARM_USE_AZUREAD]true'
        }
